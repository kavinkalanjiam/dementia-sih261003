<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/flower_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#176B61" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SIROI" />
    <link rel="apple-touch-icon" href="/images/flower_logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>SIROI - AI-Powered Cognitive Gaming & Memory Assistance</title>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen font-sans antialiased selection:bg-teal-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => {
              console.log('SIROI Service Worker registered:', reg.scope);
            })
            .catch((err) => {
              console.warn('SIROI Service Worker registration error:', err);
            });
        });
      }
    </script>
  </body>
</html>
